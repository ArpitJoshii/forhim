<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Test Telegraph Page</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f5f7fa; }
.container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
h1 { margin: 0 0 20px; color: #333; }
input, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
input:focus { border-color: #667eea; outline: none; }
button { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; cursor: pointer; font-weight: 600; }
button:hover { opacity: .9; }
.result { margin-top: 20px; padding: 15px; background: #f8f9ff; border-radius: 8px; border: 1px solid #e0e5ff; }
.result a { color: #667eea; word-break: break-all; }
.error { background: #fff5f5; border-color: #fed7d7; color: #c53030; }
.success { background: #f0fff4; border-color: #c6f6d5; color: #2f855a; }
.info { color: #666; font-size: 14px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="container">
<h1>📝 Create Test Telegraph Page</h1>
<p class="info">This will create a test photo gallery page on Telegraph</p>

<label for="title">Page Title:</label>
<input type="text" id="title" value="Photo Gallary" placeholder="Enter title">

<label for="date">Date (MM-DD):</label>
<input type="text" id="date" value="08-14" placeholder="e.g., 11-01">

<button onclick="createPage()">🚀 Create Telegraph Page</button>

<div id="result"></div>
</div>

<script>
async function createPage() {
    const title = document.getElementById('title').value.trim();
    const date = document.getElementById('date').value.trim();
    const resultDiv = document.getElementById('result');

    if (!title || !date) {
        resultDiv.innerHTML = '<div class="result error">❌ Please fill in both fields</div>';
        return;
    }

    resultDiv.innerHTML = '<div class="result">⏳ Creating page...</div>';

    // Create HTML content with sample images
    const htmlContent = `
        <h3>📸 School Photo Gallery - {date}</h3>
        <p>Test photo gallery page created on {date}.</p>
        <figure><img src="https://picsum.photos/800/600?random=1"></figure>
        <p>Sample photo from our school event.</p>
        <figure><img src="https://picsum.photos/800/600?random=2"></figure>
        <p>More photos from the gallery.</p>
        <figure><img src="https://picsum.photos/800/600?random=3"></figure>
        <p>Academic Year 2023–2024</p>
    `.replace(/{date}/g, date);

    const content = [
        { tag: "h3", children: [`📸 School Photo Gallery - ${date}`] },
        { tag: "p", children: [`Test photo gallery page created on ${date}.`] },
        { tag: "figure", children: [{ tag: "img", attrs: { src: "https://picsum.photos/800/600?random=1" } }] },
        { tag: "p", children: ["Sample photo from our school event."] },
        { tag: "figure", children: [{ tag: "img", attrs: { src: "https://picsum.photos/800/600?random=2" } }] },
        { tag: "p", children: ["More photos from the gallery."] },
        { tag: "figure", children: [{ tag: "img", attrs: { src: "https://picsum.photos/800/600?random=3" } }] },
        { tag: "p", children: ["Academic Year 2023–2024"] }
    ];

    try {
        const response = await fetch('https://api.telegra.ph/createPage', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                title: title,
                content: content,
                return_content: true
            })
        });

        const data = await response.json();

        if (data.ok && data.result) {
            const pageUrl = data.result.url;
            const path = pageUrl.replace('https://telegra.ph/', '');
            
            resultDiv.innerHTML = `
                <div class="result success">
                    ✅ <strong>Page created successfully!</strong><br><br>
                    <strong>URL:</strong> <a href="${pageUrl}" target="_blank">${pageUrl}</a><br><br>
                    <strong>Path for your gallery:</strong> <code>${path}</code><br><br>
                    <strong>Expected URL format:</strong> <code>https://telegra.ph/Photo-Gallary-${date}</code><br><br>
                    <em>Note: The page URL might be different from the path. You may need to manually rename it on Telegraph.</em>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `<div class="result error">❌ Error: ${data.error || 'Unknown error'}</div>`;
        }
    } catch (error) {
        resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
    }
}
</script>
</body>
</html>
