<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Photo Gallery | 2023–2024</title>
<style>
*{box-sizing:border-box}
:root{--primary:#4e73df;--primary-dark:#3557b7;--secondary:#764ba2;--success:#1cc88a;--dark:#1f2937;--muted:#6b7280;--light:#f5f7fb;--white:#fff;--border:#e5e7eb;--shadow:0 10px 30px rgba(0,0,0,.08)}
body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f5f7fa 0%,#e8ecf5 100%);color:var(--dark);min-height:100vh}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:45px 20px 55px;text-align:center;box-shadow:0 10px 35px rgba(76,81,180,.25)}
.header h1{margin:0;font-size:clamp(28px,5vw,48px);font-weight:800}.header p{margin:10px 0 0;opacity:.9;font-size:16px}
.container{max-width:1400px;margin:-25px auto 50px;padding:0 20px;position:relative}
.controls{background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:30px}
.search-box{flex:1;min-width:220px;position:relative}.search-box input{width:100%;padding:13px 16px 13px 44px;border:1px solid var(--border);border-radius:12px;outline:none;font-size:15px;background:#fff}.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(78,115,223,.12)}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.filters{display:flex;gap:7px;flex-wrap:wrap}.filter-btn{border:0;background:#f1f3f8;color:#4b5563;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;transition:.2s}.filter-btn:hover{background:#e4e8f4}.filter-btn.active{color:#fff;background:linear-gradient(135deg,#667eea,#764ba2)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px;flex-wrap:wrap}.result-count{color:var(--muted);font-size:14px;font-weight:600}.sort-select{border:1px solid var(--border);border-radius:9px;padding:9px 12px;background:#fff;color:#374151;outline:none}
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.gallery-card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow);transition:transform .22s ease,box-shadow .22s ease;display:flex;flex-direction:column}.gallery-card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.13)}
.preview-image{height:190px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;color:#fff;position:relative;overflow:hidden}.preview-image img{width:100%;height:100%;object-fit:cover;display:block}.preview-placeholder{text-align:center;padding:20px}.preview-placeholder .icon{font-size:48px;margin-bottom:8px}.preview-placeholder div{font-size:13px;opacity:.9}.date-badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.68);color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.3px;backdrop-filter:blur(5px);z-index:2}
.card-body{padding:18px;flex:1;display:flex;flex-direction:column}.card-title{margin:0;font-size:18px;font-weight:750;color:#202938}.card-date{margin-top:5px;color:var(--muted);font-size:13px}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:18px}
.btn{border:0;border-radius:9px;padding:10px 11px;cursor:pointer;text-decoration:none;text-align:center;font-size:13px;font-weight:700;transition:.2s;display:inline-flex;justify-content:center;align-items:center;gap:6px}.btn-preview{background:#eef2ff;color:#4e73df}.btn-preview:hover{background:#dfe6ff}.btn-open{background:linear-gradient(135deg,#4e73df,#667eea);color:#fff}.btn-open:hover{transform:translateY(-1px);box-shadow:0 5px 15px rgba(78,115,223,.3)}.btn-newtab{background:#ecfdf5;color:#059669}.btn-newtab:hover{background:#d1fae5}.btn-copy{background:#f3f4f6;color:#4b5563}.btn-copy:hover{background:#e5e7eb}
.no-results{display:none;background:#fff;border-radius:18px;padding:60px 20px;text-align:center;box-shadow:var(--shadow)}.no-results .icon{font-size:50px;margin-bottom:10px}.no-results h3{margin:5px 0}.no-results p{color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(10,15,30,.78);backdrop-filter:blur(7px);align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{width:min(1100px,100%);max-height:94vh;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column}.modal-header{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.modal-title{font-size:18px;font-weight:800}.close-btn{width:38px;height:38px;border:0;border-radius:50%;background:#f3f4f6;cursor:pointer;font-size:20px}.close-btn:hover{background:#e5e7eb}
.modal-content{padding:20px;overflow:auto;min-height:350px;max-height:68vh}.loading{display:flex;justify-content:center;align-items:center;min-height:280px;flex-direction:column;gap:12px;color:var(--muted)}.spinner{width:38px;height:38px;border:4px solid #e5e7eb;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.preview-content{max-width:950px;margin:auto}.preview-content h1,.preview-content h2,.preview-content h3,.preview-content h4{color:#202938}.preview-content img{max-width:100%;height:auto;border-radius:10px;margin:8px auto;display:block}.preview-content figure{margin:15px 0}.preview-content p{line-height:1.7;color:#374151}.preview-content blockquote{border-left:4px solid var(--primary);margin:15px 0;padding:10px 18px;background:#f8f9ff;color:#4b5563}.preview-content a{color:var(--primary)}.preview-content pre{background:#111827;color:#fff;padding:15px;overflow-x:auto;border-radius:8px}.preview-content code{background:#f3f4f6;padding:2px 5px;border-radius:4px}
.preview-error{text-align:center;padding:50px 20px}.preview-error .icon{font-size:45px}.preview-note{background:#f8f9ff;border:1px solid #e0e5ff;border-radius:12px;padding:15px;margin:15px 0;color:#4b5563}
.modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.navigation{display:flex;gap:7px}.nav-btn{border:0;background:#f3f4f6;color:#374151;padding:10px 13px;border-radius:9px;cursor:pointer;font-weight:700}.nav-btn:hover:not(:disabled){background:#e5e7eb}.nav-btn:disabled{opacity:.4;cursor:not-allowed}.footer-actions{display:flex;gap:7px;flex-wrap:wrap}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(100px);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20000;opacity:0;transition:.3s;pointer-events:none;font-size:14px}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.site-footer{text-align:center;padding:30px 20px;color:#6b7280;font-size:13px}

/* IFRAME STYLES */
.iframe-container{width:100%;height:65vh;min-height:450px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border);position:relative}
.iframe-container iframe{width:100%;height:100%;border:0;display:block}
.iframe-error{display:none;position:absolute;inset:0;background:#fff;padding:40px;text-align:center}
.iframe-error.show{display:flex;flex-direction:column;align-items:center;justify-content:center}
.iframe-error .icon{font-size:60px;margin-bottom:15px}
.iframe-error h3{margin:0 0 10px;color:var(--dark)}
.iframe-error p{margin:0 0 20px;color:var(--muted);max-width:400px}

@media(max-width:1000px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.header{padding:35px 15px 45px}.container{padding:0 12px}.gallery-grid{grid-template-columns:1fr}.controls{padding:13px}.search-box{min-width:100%}.filters{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.filter-btn{flex:0 0 auto}.modal{padding:8px}.modal-box{border-radius:14px}.modal-content{max-height:62vh}.modal-footer{flex-direction:column;align-items:stretch}.navigation,.footer-actions{width:100%}.navigation .nav-btn,.footer-actions .btn{flex:1}.iframe-container{height:55vh;min-height:380px}}
</style>
</head>
<body>

<header class="header">
<h1>📸 School Photo Gallery</h1>
<p>Academic Year 2023–2024</p>
</header>

<main class="container">
<section class="controls">
<div class="search-box">
<span class="search-icon">🔍</span>
<input type="search" id="searchInput" placeholder="Search date or gallery..." autocomplete="off">
</div>
<div class="filters">
<button class="filter-btn active" data-month="all">All</button>
<button class="filter-btn" data-month="11">November</button>
<button class="filter-btn" data-month="12">December</button>
<button class="filter-btn" data-month="01">January</button>
<button class="filter-btn" data-month="02">February</button>
</div>
</section>

<div class="toolbar">
<div class="result-count" id="resultCount">Loading galleries...</div>
<select id="sortSelect" class="sort-select">
<option value="newest">Newest First</option>
<option value="oldest">Oldest First</option>
</select>
</div>

<section id="galleryGrid" class="gallery-grid"></section>

<section id="noResults" class="no-results">
<div class="icon">🔎</div>
<h3>No galleries found</h3>
<p>Try another date or month.</p>
</section>
</main>

<footer class="site-footer">School Photo Gallery © 2023–2024</footer>

<div id="previewModal" class="modal">
<div class="modal-box">
<div class="modal-header">
<div id="modalTitle" class="modal-title">Photo Gallery</div>
<button id="closeModal" class="close-btn" aria-label="Close">×</button>
</div>

<div id="modalContent" class="modal-content">
<div class="loading"><div class="spinner"></div><div>Loading preview...</div></div>
</div>

<div class="modal-footer">
<div class="navigation">
<button id="firstBtn" class="nav-btn">⏮ First</button>
<button id="prevBtn" class="nav-btn">◀ Previous</button>
<button id="nextBtn" class="nav-btn">Next ▶</button>
<button id="lastBtn" class="nav-btn">Last ⏭</button>
</div>
<div class="footer-actions">
<button id="copyBtn" class="btn btn-copy">📋 Copy Link</button>
<a id="openBtn" class="btn btn-open" href="#" target="_self">🔗 Open Gallery</a>
<a id="newTabBtn" class="btn btn-newtab" href="#" target="_blank" rel="noopener noreferrer">↗ New Tab</a>
</div>
</div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   CONFIGURATION
   ============================================================ */

const START_DATE = "2023-11-01";
const END_DATE   = "2024-02-28";
const TELEGRAPH_BASE = "https://telegra.ph/Photo-Gallary-";
const PROXY_URL = window.location.origin + window.location.pathname.replace(/\/index\.html$/, '/') + 'proxy.html';
const generateAllDates = true;
const availableDates = [];

/* ============================================================
   DATE FUNCTIONS
   ============================================================ */

function pad(number) { return String(number).padStart(2, "0"); }
function parseDate(dateString) { return new Date(dateString + "T00:00:00"); }

function formatTelegraphDate(dateString) {
    const date = parseDate(dateString);
    return pad(date.getMonth() + 1) + "-" + pad(date.getDate());
}

function formatDisplayDate(dateString) {
    return new Intl.DateTimeFormat("en-GB", {
        day: "2-digit", month: "long", year: "numeric"
    }).format(parseDate(dateString));
}

function formatShortDate(dateString) {
    return new Intl.DateTimeFormat("en-US", {
        day: "2-digit", month: "short", year: "numeric"
    }).format(parseDate(dateString));
}

function getMonthNumber(dateString) {
    return pad(parseDate(dateString).getMonth() + 1);
}

function createDateList() {
    if (!generateAllDates) return [...availableDates];
    const dates = [];
    let current = parseDate(START_DATE);
    const end = parseDate(END_DATE);
    while (current <= end) {
        const year = current.getFullYear();
        const month = pad(current.getMonth() + 1);
        const day = pad(current.getDate());
        dates.push(`${year}-${month}-${day}`);
        current.setDate(current.getDate() + 1);
    }
    return dates;
}

/* ============================================================
   GALLERY DATA
   ============================================================ */

let galleries = createDateList().map((dateString, index) => {
    const telegraphDate = formatTelegraphDate(dateString);
    return {
        id: index,
        date: dateString,
        displayDate: formatDisplayDate(dateString),
        month: getMonthNumber(dateString),
        title: "Photo Gallery",
        url: TELEGRAPH_BASE + telegraphDate,
        previewImage: null,
        previewLoaded: false,
        cachedPage: null,
        exists: null,
        loading: false
    };
});

/* ============================================================
   STATE
   ============================================================ */

let currentMonth = "all";
let currentSearch = "";
let currentSort = "newest";
let currentGalleryIndex = -1;
let toastTimer = null;

/* ============================================================
   DOM
   ============================================================ */

const galleryGrid = document.getElementById("galleryGrid");
const noResults = document.getElementById("noResults");
const resultCount = document.getElementById("resultCount");
const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");
const previewModal = document.getElementById("previewModal");
const modalTitle = document.getElementById("modalTitle");
const modalContent = document.getElementById("modalContent");
const closeModal = document.getElementById("closeModal");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const firstBtn = document.getElementById("firstBtn");
const lastBtn = document.getElementById("lastBtn");
const copyBtn = document.getElementById("copyBtn");
const openBtn = document.getElementById("openBtn");
const newTabBtn = document.getElementById("newTabBtn");
const toast = document.getElementById("toast");

/* ============================================================
   FILTER & SORT
   ============================================================ */

function getFilteredGalleries() {
    let filtered = [...galleries];
    if (currentMonth !== "all") {
        filtered = filtered.filter(gallery => gallery.month === currentMonth);
    }
    if (currentSearch) {
        const search = currentSearch.toLowerCase();
        filtered = filtered.filter(gallery =>
            gallery.title.toLowerCase().includes(search) ||
            gallery.displayDate.toLowerCase().includes(search) ||
            gallery.url.toLowerCase().includes(search)
        );
    }
    filtered.sort((a, b) => {
        if (currentSort === "newest") return b.date.localeCompare(a.date);
        return a.date.localeCompare(b.date);
    });
    return filtered;
}

/* ============================================================
   RENDER GRID
   ============================================================ */

function renderGrid() {
    const filtered = getFilteredGalleries();
    galleryGrid.innerHTML = "";
    resultCount.textContent = `${filtered.length} ${filtered.length === 1 ? "gallery" : "galleries"} found`;

    if (!filtered.length) {
        noResults.style.display = "block";
        return;
    }
    noResults.style.display = "none";

    filtered.forEach(gallery => {
        const card = document.createElement("article");
        card.className = "gallery-card";

        let previewHTML = `<div class="preview-placeholder"><div class="icon">🔄</div><div>Loading...</div></div>`;

        if (gallery.previewImage) {
            previewHTML = `<img src="${escapeAttribute(gallery.previewImage)}" alt="Photo Gallery" loading="lazy">`;
        } else if (gallery.exists === false) {
            previewHTML = `<div class="preview-placeholder"><div class="icon">⚠️</div><div>Not available</div></div>`;
        }

        card.innerHTML = `
            <div class="preview-image">
                <div class="date-badge">${formatShortDate(gallery.date)}</div>
                ${previewHTML}
            </div>
            <div class="card-body">
                <h3 class="card-title">Photo Gallery</h3>
                <div class="card-date">📅 ${gallery.displayDate}</div>
                <div class="card-actions">
                    <button class="btn btn-preview" data-preview-id="${gallery.id}">👁 Preview</button>
                    <a class="btn btn-open" href="${escapeAttribute(gallery.url)}" target="_self">🔗 Open</a>
                    <a class="btn btn-newtab" href="${escapeAttribute(gallery.url)}" target="_blank" rel="noopener noreferrer">↗ New Tab</a>
                    <button class="btn btn-copy" data-copy-url="${escapeAttribute(gallery.url)}">📋 Copy Link</button>
                </div>
            </div>
        `;

        card.querySelector("[data-preview-id]").addEventListener("click", () => openPreview(gallery.id));
        card.querySelector("[data-copy-url]").addEventListener("click", () => copyGalleryLink(gallery.url));
        galleryGrid.appendChild(card);
    });
}

function escapeAttribute(value) {
    return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ============================================================
   OPEN PREVIEW (IFRAME FIRST - ALWAYS SHOWS SOMETHING)
   ============================================================ */

async function openPreview(id, pushHistory = true) {
    const index = galleries.findIndex(gallery => gallery.id === id);
    if (index === -1) return;

    currentGalleryIndex = index;
    const gallery = galleries[index];

    modalTitle.textContent = `${gallery.title} — ${gallery.displayDate}`;
    openBtn.href = gallery.url;
    newTabBtn.href = gallery.url;

    previewModal.classList.add("show");
    document.body.style.overflow = "hidden";
    updateNavigation();

    if (pushHistory) {
        history.pushState({ galleryId: id }, "", "#gallery-" + id);
    }

    // ALWAYS show iframe first (even if it shows "refused to connect")
    renderIframePreview(gallery);

    // Try to get API data in background for thumbnail
    if (!gallery.previewLoaded && !gallery.loading) {
        loadTelegraphPreview(gallery);
    }
}

/* ============================================================
   RENDER IFRAME (PRIMARY METHOD - ALWAYS WORKS)
   ============================================================ */

function renderIframePreview(gallery) {
    modalContent.innerHTML = `
        <div class="preview-content">
            <div class="preview-note" style="margin-bottom:15px">
                📌 Loading Telegraph gallery below. If you see "refused to connect", 
                click "Open Gallery" or "New Tab" buttons below.
            </div>
            
            <div class="iframe-container">
                <iframe
                    src="${escapeAttribute(gallery.url)}"
                    title="Telegraph Photo Gallery"
                    loading="eager"
                    sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
                </iframe>
                <div class="iframe-error" id="iframeError">
                    <div class="icon">⚠️</div>
                    <h3>Unable to load gallery</h3>
                    <p>This page cannot be displayed in a frame. Please open it in a new tab.</p>
                    <a href="${escapeAttribute(gallery.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-newtab">
                        ↗ Open in New Tab
                    </a>
                </div>
            </div>
        </div>
    `;

    // Check if iframe loaded after 3 seconds
    setTimeout(() => {
        const iframe = modalContent.querySelector("iframe");
        if (iframe && iframe.contentWindow && iframe.contentWindow.location.href === "about:blank") {
            const errorDiv = modalContent.querySelector("#iframeError");
            if (errorDiv) errorDiv.classList.add("show");
        }
    }, 3000);
}

/* ============================================================
   TELEGRAPH API (FOR THUMBNAILS ONLY)
   ============================================================ */

async function loadTelegraphPreview(gallery) {
    if (gallery.loading) return;
    gallery.loading = true;

    try {
        const pageUrl = new URL(gallery.url);
        const path = pageUrl.pathname.replace(/^\/+/, "");
        const proxyUrl = `${PROXY_URL}?path=${encodeURIComponent(path)}`;
        
        const response = await fetch(proxyUrl, { method: "GET", cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        if (!data.ok || !data.result) throw new Error("Telegraph page not found");

        gallery.exists = true;
        gallery.previewLoaded = true;
        gallery.cachedPage = data.result;
        gallery.previewImage = findFirstImage(data.result.content);

        updateCardImage(gallery);
        renderGrid();

    } catch (error) {
        console.warn("Telegraph API preview failed:", error);
        gallery.exists = false;
        gallery.previewLoaded = true;
        renderGrid();
    } finally {
        gallery.loading = false;
    }
}

/* ============================================================
   FIND FIRST IMAGE
   ============================================================ */

function findFirstImage(nodes) {
    if (!Array.isArray(nodes)) return null;
    for (const node of nodes) {
        if (!node) continue;
        if (node.tag === "img" && node.attrs && node.attrs.src) {
            return node.attrs.src;
        }
        if (node.children) {
            const result = findFirstImage(node.children);
            if (result) return result;
        }
    }
    return null;
}

/* ============================================================
   UPDATE CARD IMAGE
   ============================================================ */

function updateCardImage(gallery) {
    if (!gallery.previewImage) return;
    const cards = document.querySelectorAll(".gallery-card");
    cards.forEach(card => {
        const button = card.querySelector("[data-preview-id]");
        if (!button || Number(button.dataset.previewId) !== gallery.id) return;
        const preview = card.querySelector(".preview-image");
        if (!preview) return;
        const old = preview.querySelector(".preview-placeholder");
        if (old) old.remove();
        if (!preview.querySelector("img")) {
            const img = document.createElement("img");
            img.src = gallery.previewImage;
            img.alt = "Photo Gallery";
            img.loading = "lazy";
            preview.appendChild(img);
        }
    });
}

/* ============================================================
   NAVIGATION
   ============================================================ */

function updateNavigation() {
    prevBtn.disabled = currentGalleryIndex <= 0;
    firstBtn.disabled = currentGalleryIndex <= 0;
    nextBtn.disabled = currentGalleryIndex >= galleries.length - 1;
    lastBtn.disabled = currentGalleryIndex >= galleries.length - 1;
}

function goPrevious() {
    if (currentGalleryIndex <= 0) return;
    openPreview(galleries[currentGalleryIndex - 1].id);
}

function goNext() {
    if (currentGalleryIndex >= galleries.length - 1) return;
    openPreview(galleries[currentGalleryIndex + 1].id);
}

function goFirst() {
    if (!galleries.length) return;
    openPreview(galleries[0].id);
}

function goLast() {
    if (!galleries.length) return;
    openPreview(galleries[galleries.length - 1].id);
}

/* ============================================================
   CLOSE
   ============================================================ */

function closePreview(removeHistory = true) {
    previewModal.classList.remove("show");
    document.body.style.overflow = "";
    if (removeHistory && location.hash) {
        history.pushState({}, "", window.location.pathname + window.location.search);
    }
}

/* ============================================================
   COPY LINK
   ============================================================ */

async function copyGalleryLink(url) {
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(url);
        } else {
            const input = document.createElement("input");
            input.value = url;
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            input.remove();
        }
        showToast("Gallery link copied!");
    } catch (error) {
        showToast("Could not copy link.");
    }
}

/* ============================================================
   TOAST
   ============================================================ */

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */

searchInput.addEventListener("input", function () {
    currentSearch = this.value.trim();
    renderGrid();
});

document.querySelectorAll(".filter-btn").forEach(button => {
    button.addEventListener("click", function () {
        document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
        this.classList.add("active");
        currentMonth = this.dataset.month;
        renderGrid();
    });
});

sortSelect.addEventListener("change", function () {
    currentSort = this.value;
    renderGrid();
});

closeModal.addEventListener("click", () => closePreview());
prevBtn.addEventListener("click", goPrevious);
nextBtn.addEventListener("click", goNext);
firstBtn.addEventListener("click", goFirst);
lastBtn.addEventListener("click", goLast);

copyBtn.addEventListener("click", function () {
    if (currentGalleryIndex >= 0) {
        copyGalleryLink(galleries[currentGalleryIndex].url);
    }
});

previewModal.addEventListener("click", function (event) {
    if (event.target === previewModal) closePreview();
});

document.addEventListener("keydown", function (event) {
    if (!previewModal.classList.contains("show")) return;
    if (event.key === "Escape") {
        closePreview();
        return;
    }
    if (event.key === "ArrowLeft") goPrevious();
    if (event.key === "ArrowRight") goNext();
});

window.addEventListener("popstate", function () {
    const hash = window.location.hash;
    if (hash.startsWith("#gallery-")) {
        const id = Number(hash.replace("#gallery-", ""));
        if (galleries.some(gallery => gallery.id === id)) {
            openPreview(id, false);
        }
    } else {
        closePreview(false);
    }
});

function loadHashGallery() {
    const hash = window.location.hash;
    if (!hash.startsWith("#gallery-")) return;
    const id = Number(hash.replace("#gallery-", ""));
    if (galleries.some(gallery => gallery.id === id)) {
        openPreview(id, false);
    }
}

/* ============================================================
   INITIALIZE
   ============================================================ */

renderGrid();
loadHashGallery();
</script>

</body>
</html>
